<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogos do LED</title>
  <meta name="description" content="Menu de jogos do Laboratório de Educação Digital para o 1º, 2º e 3º ano.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1><span aria-hidden="true">🎮</span> Jogos do LED</h1>
    <p class="convite">Escolha um jogo!</p>
  </header>

  <main>
    <h2 class="so-leitor">Lista de jogos</h2>
    <ul id="lista-jogos" class="jogos">
      <!-- Os cartões são criados por js/menu.js a partir da lista em js/jogos.js.
           Os links abaixo só aparecem se o JavaScript estiver desligado. -->
      <li><a class="cartao cor-azul" href="https://phisantos51-hub.github.io/JOGO-DE-ALFABETIZA-O/"><span class="nome">Robô Letrinha</span></a></li>
      <li><a class="cartao cor-verde" href="https://phisantos51-hub.github.io/JOGO-DE-ALFABETIZA-O/matematica/"><span class="nome">Feira do Robô</span></a></li>
      <li><a class="cartao cor-laranja" href="https://phisantos51-hub.github.io/robo-desenhista/"><span class="nome">Robô Desenhista</span></a></li>
      <li><a class="cartao cor-roxo" href="https://phisantos51-hub.github.io/craques-do-led/"><span class="nome">Craques do LED</span></a></li>
    </ul>
  </main>

  <footer class="rodape">
    <p>Jogos criados pelo Professor Orientador de Educação Digital Pedro Inoue para o Laboratório de Educação Digital</p>
  </footer>

  <script src="js/jogos.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
